<!-- Aras Innovator R36 - Client Form Multi-Label Field 元件容器 -->
<div id="bcs_label_container" style="width: 100%; min-width: 260px;"></div>

<style>
/* 標籤元件視覺樣式 (支援 Aras R36 現代化扁平介面) */
:root {
  --bcs-tag-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bcs-tag-border: #D1D5DB;
  --bcs-tag-focus-border: #3B82F6;
  --bcs-tag-focus-ring: rgba(59, 130, 246, 0.2);
}

.bcs-multi-label-container {
  position: relative;
  font-family: var(--bcs-tag-font);
  width: 100%;
  box-sizing: border-box;
}

.bcs-tag-wrapper {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  min-height: 38px;
  background-color: #FFFFFF;
  border: 1px solid var(--bcs-tag-border);
  border-radius: 6px;
  transition: all 0.18s ease;
  cursor: text;
  box-sizing: border-box;
}

.bcs-tag-wrapper:hover {
  border-color: #9CA3AF;
}

.bcs-tag-wrapper.is-focused {
  border-color: var(--bcs-tag-focus-border);
  box-shadow: 0 0 0 3px var(--bcs-tag-focus-ring);
}

.bcs-tag-wrapper.is-readonly {
  background-color: #F9FAFB;
  border-color: #E5E7EB;
  cursor: default;
}

.bcs-tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 9999px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  color: #FFFFFF;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  user-select: none;
  animation: bcsPopIn 0.18s ease-out;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.bcs-tag-badge:hover {
  transform: translateY(-1px);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
}

.bcs-tag-remove-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin-left: 2px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.18);
  color: inherit;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  border: none;
  padding: 0;
  transition: background 0.15s ease;
}

.bcs-tag-remove-btn:hover {
  background: rgba(0, 0, 0, 0.4);
}

.bcs-tag-input {
  flex: 1 1 120px;
  min-width: 80px;
  border: none;
  outline: none;
  font-size: 13px;
  padding: 4px 6px;
  background: transparent;
  color: #1F2937;
  font-family: inherit;
}

.bcs-tag-input::placeholder {
  color: #9CA3AF;
  font-style: italic;
}

.bcs-tag-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 1000;
  background: #FFFFFF;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  max-height: 220px;
  overflow-y: auto;
  padding: 6px;
  display: none;
}

.bcs-tag-dropdown.is-open {
  display: block;
}

.bcs-dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 13px;
  color: #374151;
  cursor: pointer;
  transition: background-color 0.15s ease;
}

.bcs-dropdown-item:hover,
.bcs-dropdown-item.is-highlighted {
  background-color: #F3F4F6;
  color: #111827;
}

.bcs-dropdown-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 8px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
}

.bcs-dropdown-subtext {
  font-size: 11px;
  color: #9CA3AF;
  margin-left: 6px;
}

.bcs-dropdown-empty {
  padding: 12px;
  text-align: center;
  font-size: 12px;
  color: #9CA3AF;
}

@keyframes bcsPopIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes bcsShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-4px); }
  40%, 80% { transform: translateX(4px); }
}

.bcs-tag-shake {
  animation: bcsShake 0.35s ease-in-out;
}
</style>

<script>
/**
 * Aras Innovator R36 Multi-Label Client Field Runtime
 */
(function(window) {
  // 1. LabelTag 類別
  class LabelTag {
    constructor(name, label, color = "#3B82F6", sort_id = 0, labels = {}) {
      this.name = (name || "").trim();
      this.label = (label || this.name).trim();
      this.color = LabelTag.normalizeColor(color);
      this.sort_id = parseFloat(sort_id) || 0;
      this.labels = labels && typeof labels === "object" ? { ...labels } : {};
      if (!this.labels["default"] && this.label) {
        this.labels["default"] = this.label;
      }
    }

    static normalizeColor(rawColor) {
      if (!rawColor || typeof rawColor !== "string") return "#3B82F6";
      const clean = rawColor.trim();
      const hexRegex = /^#([A-Fa-f0-9]{3}|[A-Fa-f0-9]{6})$/;
      if (hexRegex.test(clean)) {
        if (clean.length === 4) {
          return `#${clean[1]}${clean[1]}${clean[2]}${clean[2]}${clean[3]}${clean[3]}`.toUpperCase();
        }
        return clean.toUpperCase();
      }
      return "#3B82F6";
    }

    getDisplayLabel(langCode = "zh-TW") {
      if (this.labels && typeof this.labels === "object") {
        if (this.labels[langCode]) return this.labels[langCode];
        const baseLang = langCode.split("-")[0];
        if (this.labels[baseLang]) return this.labels[baseLang];
        if (this.labels["en"]) return this.labels["en"];
        if (this.labels["default"]) return this.labels["default"];
      }
      return this.label || this.name;
    }

    getContrastTextColor() {
      const hex = this.color.replace("#", "");
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq >= 150 ? "#1F2937" : "#FFFFFF";
    }

    toJSON() {
      return {
        name: this.name,
        label: this.label,
        labels: this.labels,
        color: this.color,
        sort_id: this.sort_id
      };
    }

    static fromJSON(obj) {
      return new LabelTag(obj.name, obj.label, obj.color, obj.sort_id, obj.labels);
    }
  }

  // 2. LabelStore 類別
  class LabelStore {
    constructor() {
      this.tags = [];
    }

    has(name) {
      const target = (name || "").trim().toLowerCase();
      return this.tags.some((t) => t.name.toLowerCase() === target);
    }

    add(tag) {
      if (!tag || this.has(tag.name)) return false;
      this.tags.push(tag);
      this.tags.sort((a, b) => a.sort_id - b.sort_id);
      return true;
    }

    removeByName(name) {
      const target = (name || "").trim().toLowerCase();
      const initialLen = this.tags.length;
      this.tags = this.tags.filter((t) => t.name.toLowerCase() !== target);
      return this.tags.length < initialLen;
    }

    getAll() {
      return [...this.tags];
    }

    serializeJSON() {
      return JSON.stringify(this.tags.map((t) => t.toJSON()));
    }

    deserializeJSON(jsonString) {
      this.tags = [];
      if (!jsonString || typeof jsonString !== "string") return;
      try {
        const arr = JSON.parse(jsonString.trim());
        if (Array.isArray(arr)) {
          arr.forEach((it) => {
            if (it && it.name) this.add(LabelTag.fromJSON(it));
          });
        }
      } catch (e) {
        console.warn("LabelStore 解析失敗：", e);
      }
    }
  }

  // 3. 全域初始化工廠函式
  window.initBcsMultiLabelField = async function(config) {
    const container = document.getElementById(config.containerId);
    if (!container) return;

    const propertyName = config.propertyName || "labels";
    const categoryName = config.labelCategoryName || "Part_Labels";

    // 跨視窗層次尋找 Aras 全域核心物件與 Form Item
    // 跨視窗層次尋找 Aras 全域核心物件與 Form Item
    const parentWin = window.parent || window;
    const topWin = window.top || window;
    const arasObj = window.aras || (parentWin && parentWin.aras) || (topWin && topWin.aras);
    const curDoc = window.document;
    const parentDoc = (parentWin && parentWin.document) || curDoc;
    const itemNode = (curDoc && curDoc.item) || (parentDoc && parentDoc.item) || (topWin.document && topWin.document.item) || topWin.item || (parentWin && parentWin.item);
    const thisItemObj = (curDoc && curDoc.thisItem) || (parentDoc && parentDoc.thisItem);
    const handleItemChangeFn = window.handleItemChange || (parentWin && parentWin.handleItemChange) || (topWin && topWin.handleItemChange);

    const currentItemId = (itemNode && itemNode.getAttribute && itemNode.getAttribute("id")) || 
                          (window.itemID) || 
                          (parentWin && parentWin.itemID) || 
                          (topWin && topWin.itemID) || 
                          (topWin.item && topWin.item.getAttribute && topWin.item.getAttribute("id")) || 
                          (parentWin.item && parentWin.item.getAttribute && parentWin.item.getAttribute("id")) || 
                          (thisItemObj && typeof thisItemObj.getID === "function" && thisItemObj.getID()) || "";
    const currentItemType = (itemNode && itemNode.getAttribute && itemNode.getAttribute("type")) || 
                            (window.itemTypeName) || 
                            (parentWin && parentWin.itemTypeName) || 
                            (thisItemObj && typeof thisItemObj.getType === "function" && thisItemObj.getType()) || "Part";

    // 探測 Part ItemType 實際擁有的 label 相關屬性名稱，協助驗證欄位命名
    try {
      if (arasObj && typeof arasObj.applyItem === "function") {
        const checkPropAml = `<Item type="Property" action="get" select="name,label,data_type"><source_id><Item type="ItemType" action="get"><name>${currentItemType}</name></Item></source_id><name condition="like">%label%</name></Item>`;
        const checkRes = arasObj.applyItem(checkPropAml);
        console.log(`[bcs_label] 系統探測 ${currentItemType} 屬性定義結果：`, checkRes);
      }
    } catch (e) {}

    // 安全判定是否為尚未存檔之暫存新項目 (全域共用變數，防範 ReferenceError)
    let isTempItem = false;
    try {
      if (arasObj && itemNode && typeof arasObj.isTemp === "function") {
        isTempItem = Boolean(arasObj.isTemp(itemNode));
      }
    } catch (tErr) {
      isTempItem = false;
    }

    // 輔助函式：強韌擷取 XML 屬性值 (相容所有命名空間與 CDATA)
    function extractPropertyValue(sourceXml, prop) {
      if (!sourceXml) return "";
      let str = typeof sourceXml === "string" ? sourceXml : (sourceXml.xml || sourceXml.outerHTML || "");
      if (!str && sourceXml.getElementsByTagName) {
        const nodes = sourceXml.getElementsByTagName(prop);
        if (nodes && nodes[0]) return nodes[0].textContent || nodes[0].text || "";
      }
      if (!str) return "";
      const regex = new RegExp("<" + prop + "(?:[^>]*)>(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\]\\]>)?<\\/" + prop + ">", "i");
      const match = str.match(regex);
      return match && match[1] ? match[1].trim() : "";
    }

    // 1. 取得當前使用者登入語系
    let currentLang = "zh-TW";
    try {
      if (arasObj && typeof arasObj.getSessionContext === "function") {
        currentLang = arasObj.getSessionContext().getLanguageCode() || "zh-TW";
      } else if (arasObj && typeof arasObj.getLanguageCode === "function") {
        currentLang = arasObj.getLanguageCode() || "zh-TW";
      }
    } catch (e) {
      currentLang = "zh-TW";
    }

    // 2. 判斷表單是否處於可編輯狀態 (Edit Mode)
    let isEditMode = true;
    try {
      if (typeof window.isEditMode !== "undefined") {
        isEditMode = Boolean(window.isEditMode);
      } else if (window.document && typeof window.document.isEditMode !== "undefined") {
        isEditMode = Boolean(window.document.isEditMode);
      } else if (parentWin && typeof parentWin.isEditMode !== "undefined") {
        isEditMode = Boolean(parentWin.isEditMode);
      } else if (arasObj && itemNode && typeof arasObj.isLockedByUser === "function") {
        isEditMode = Boolean(arasObj.isLockedByUser(itemNode) || arasObj.isTemp(itemNode));
      }
    } catch (e) {
      isEditMode = true;
    }

    // 3. 讀取現有資料 (多層 Fallback + 伺服器主動補查)
    let rawJSON = "";
    try {
      // (A) 優先檢查表單上是否有對應名稱的原生輸入欄位 (隱藏屬性技巧)
      let nativeField = (curDoc && (curDoc.getElementsByName(propertyName)[0] || curDoc.querySelector(`[name='${propertyName}']`))) ||
                        (parentDoc && (parentDoc.getElementsByName(propertyName)[0] || parentDoc.querySelector(`[name='${propertyName}']`)));
      if (nativeField && nativeField.value) {
        rawJSON = nativeField.value;
      } else if (arasObj && itemNode && typeof arasObj.getItemProperty === "function") {
        rawJSON = arasObj.getItemProperty(itemNode, propertyName) || "";
      } else if (thisItemObj && typeof thisItemObj.getProperty === "function") {
        rawJSON = thisItemObj.getProperty(propertyName, "") || "";
      } else if (itemNode) {
        if (typeof itemNode.getProperty === "function") {
          rawJSON = itemNode.getProperty(propertyName) || "";
        } else {
          const propNode = itemNode.selectSingleNode ? itemNode.selectSingleNode(propertyName) : itemNode.querySelector(propertyName);
          rawJSON = propNode ? (propNode.text || propNode.textContent || "") : "";
        }
      }

      // (B) 終極保證：若從表單 DOM 讀取為空，且已具備項目 ID，直接向伺服器補查資料庫真實欄位值
      if (!rawJSON && arasObj && currentItemId && !isTempItem) {
        console.log(`[bcs_label] 偵測到表單未帶出 ${propertyName}，啟動伺服器主動補查 (ID: ${currentItemId}, Type: ${currentItemType})`);
        
        // 優先使用原生 applyItem 查詢
        if (typeof arasObj.applyItem === "function") {
          try {
            const qAml = `<Item type="${currentItemType}" action="get" id="${currentItemId}" select="${propertyName}"/>`;
            const qRes = arasObj.applyItem(qAml);
            const extracted = extractPropertyValue(qRes, propertyName);
            if (extracted) {
              rawJSON = extracted;
              console.log("[bcs_label] ★★★ 透過 applyItem 成功補查取得資料庫真實值：", rawJSON);
            } else {
              console.log("[bcs_label] applyItem 補查回應中無此欄位內容：", qRes);
            }
          } catch (amlErr) {
            console.warn("[bcs_label] applyItem 補查異常：", amlErr);
          }
        }

        // 備用使用 newIOMItem
        if (!rawJSON && typeof arasObj.newIOMItem === "function") {
          try {
            const queryItem = arasObj.newIOMItem(currentItemType, "get");
            queryItem.setID(currentItemId);
            queryItem.setAttribute("select", propertyName);
            const queryRes = queryItem.apply();
            if (!queryRes.isError()) {
              rawJSON = queryRes.getProperty(propertyName, "") || "";
              if (rawJSON) {
                console.log("[bcs_label] ★★★ 透過 IOM 成功補查取得資料庫真實值：", rawJSON);
              }
            } else {
              console.log("[bcs_label] IOM 補查未取得（可能尚無值）：", queryRes.getErrorString());
            }
          } catch (qErr) {
            console.warn("[bcs_label] IOM 補查異常：", qErr);
          }
        }

        // 若補查成功，順手回填本地 itemNode 並即刻更新 UI
        if (rawJSON && arasObj && itemNode && typeof arasObj.setItemProperty === "function") {
          try {
            arasObj.setItemProperty(itemNode, propertyName, rawJSON);
          } catch (e) {}
        }
        if (rawJSON) {
          store.deserializeJSON(rawJSON);
          renderBadges();
        }
      }

      // (C) 自動在表單中動態注入原生 hidden input 欄位 (確保點擊 Save 時表單收集器能自動抓到)
      if (!nativeField) {
        try {
          const targetForm = (parentDoc && parentDoc.forms && parentDoc.forms[0]) || (curDoc && curDoc.forms && curDoc.forms[0]) || (curDoc && curDoc.body);
          if (targetForm) {
            nativeField = curDoc.createElement("input");
            nativeField.type = "hidden";
            nativeField.name = propertyName;
            nativeField.id = "bcs_hidden_" + propertyName;
            nativeField.value = rawJSON;
            targetForm.appendChild(nativeField);
            console.log("[bcs_label] 已動態注入表單原生 hidden 欄位，打通 Save 收集通道！");
          }
        } catch (injectErr) {
          console.warn("[bcs_label] 動態注入 hidden 欄位提示：", injectErr);
        }
      } else {
        nativeField.value = rawJSON;
      }
    } catch (err) {
      console.warn("[bcs_label] 讀取屬性失敗：", err);
    }

    console.log("[bcs_label] 初始化載入 - 屬性:", propertyName, "現有值:", rawJSON, "編輯模式:", isEditMode);

    const store = new LabelStore();
    store.deserializeJSON(rawJSON);

    // 4. 查詢 bcs_label 及其關聯的 bcs_label_tags
    let availableTags = [];
    if (arasObj && typeof arasObj.newIOMItem === "function") {
      try {
        const q = arasObj.newIOMItem("bcs_label", "get");
        q.setAttribute("select", "name");
        q.setProperty("name", categoryName);
        const rel = arasObj.newIOMItem("bcs_label_tags", "get");
        rel.setAttribute("select", "sort_id,name,label,color");
        rel.setAttribute("orderBy", "sort_id");
        q.addRelationship(rel);
        const res = q.apply();
        if (!res.isError()) {
          const rels = res.getRelationships("bcs_label_tags");
          for (let i = 0; i < rels.getItemCount(); i++) {
            const it = rels.getItemByIndex(i);
            const n = it.getProperty("name");
            const l = it.getProperty("label") || n;
            const c = it.getProperty("color") || "#3B82F6";
            const s = parseFloat(it.getProperty("sort_id")) || 0;
            availableTags.push(new LabelTag(n, l, c, s, { [currentLang]: l, default: l }));
          }
        }
      } catch (err) {
        console.warn("[bcs_label] 載入 bcs_label 標籤清單異常：", err);
      }
    }

    // 5. 繪製 UI
    container.classList.add("bcs-multi-label-container");
    container.innerHTML = `
      <div class="bcs-tag-wrapper ${!isEditMode ? 'is-readonly' : ''}" id="bcsTagWrapper">
        <div class="bcs-tag-list" id="bcsTagList" style="display:contents;"></div>
        <input type="text" class="bcs-tag-input" id="bcsTagInput" placeholder="搜尋或添加標籤..." autocomplete="off" style="${!isEditMode ? 'display:none;' : ''}" />
      </div>
      <div class="bcs-tag-dropdown" id="bcsTagDropdown"></div>
    `;

    const wrapper = container.querySelector("#bcsTagWrapper");
    const tagList = container.querySelector("#bcsTagList");
    const input = container.querySelector("#bcsTagInput");
    const dropdown = container.querySelector("#bcsTagDropdown");

    function renderBadges() {
      tagList.innerHTML = "";
      store.getAll().forEach((tag) => {
        const badge = document.createElement("span");
        badge.className = "bcs-tag-badge";
        badge.dataset.name = tag.name;
        badge.style.backgroundColor = tag.color;
        badge.style.color = tag.getContrastTextColor();
        badge.innerHTML = `<span>${tag.getDisplayLabel(currentLang)}</span>`;

        if (isEditMode) {
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "bcs-tag-remove-btn";
          removeBtn.innerHTML = "&times;";
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            store.removeByName(tag.name);
            syncValue();
            renderBadges();
          };
          badge.appendChild(removeBtn);
        }
        tagList.appendChild(badge);
      });
    }

    // 6. 同步資料至 Aras Form 與後端持久化 (全方位直通儲存架構)
    function syncValue() {
      const jsonStr = store.serializeJSON();
      console.log("[bcs_label] 同步變更至表單 - 欄位:", propertyName, "內容:", jsonStr);

      // (A) 若表單上有 labels 原生欄位 (Hidden Property)，直接更新值並派發 change 事件
      try {
        const curD = window.document;
        const parD = (window.parent && window.parent.document) || curD;
        const nativeInput = (curD && (curD.getElementsByName(propertyName)[0] || curD.querySelector(`[name='${propertyName}']`))) ||
                            (parD && (parD.getElementsByName(propertyName)[0] || parD.querySelector(`[name='${propertyName}']`)));
        if (nativeInput) {
          nativeInput.value = jsonStr;
          if ("createEvent" in document) {
            const evt = document.createEvent("HTMLEvents");
            evt.initEvent("change", false, true);
            nativeInput.dispatchEvent(evt);
          } else if (nativeInput.fireEvent) {
            nativeInput.fireEvent("onchange");
          }
        }
      } catch (e) {
        console.warn("[bcs_label] 同步原生欄位提示：", e);
      }

      // (B) 優先觸發 handleItemChange (通知 Form 髒標記與 UI 連動)
      if (typeof handleItemChangeFn === "function") {
        try {
          handleItemChangeFn(propertyName, jsonStr);
        } catch (e) {
          console.warn("[bcs_label] handleItemChange 呼叫提示：", e);
        }
      }

      // (C) 直接向 document.thisItem 物件同步
      if (thisItemObj && typeof thisItemObj.setProperty === "function") {
        try {
          thisItemObj.setProperty(propertyName, jsonStr);
        } catch (e) {
          console.warn("[bcs_label] thisItem.setProperty 呼叫提示：", e);
        }
      }

      // (D) 直接向底層 item XMLNode 寫入 property，並標記 edit action
      const targets = [itemNode, topWin.item, parentWin.item];
      targets.forEach((target) => {
        if (arasObj && target && typeof arasObj.setItemProperty === "function") {
          try {
            arasObj.setItemProperty(target, propertyName, jsonStr);
            if (target.getAttribute && !target.getAttribute("action")) {
              target.setAttribute("action", "edit");
            }
          } catch (e) {}
        }
      });

      // (E) 關鍵終極保障：直通後端資料庫更新 (即刻持久化寫入，不受客戶端刷新或解除鎖定影響)
      if (arasObj && currentItemId && !isTempItem) {
        let savedDirectly = false;
        // 優先嘗試使用 Aras 核心原生 applyItem API
        if (typeof arasObj.applyItem === "function") {
          try {
            const aml = `<Item type="${currentItemType}" action="edit" id="${currentItemId}" version="0"><${propertyName}><![CDATA[${jsonStr}]]></${propertyName}></Item>`;
            const resXml = arasObj.applyItem(aml);
            console.log("[bcs_label] applyItem 直通寫入伺服器回應：", resXml);
            if (resXml && !resXml.includes("<faultcode>")) {
              savedDirectly = true;
              console.log("[bcs_label] ★★★ 後端資料庫直通保存成功 (applyItem)！ ★★★");
            } else {
              console.warn("[bcs_label] applyItem 直通寫入警告/錯誤：", resXml);
            }
          } catch (e) {
            console.warn("[bcs_label] applyItem 執行異常：", e);
          }
        }

        // 若 applyItem 未完成，嘗試使用 IOM API
        if (!savedDirectly && typeof arasObj.newIOMItem === "function") {
          try {
            const directUpdate = arasObj.newIOMItem(currentItemType, "edit");
            directUpdate.setID(currentItemId);
            directUpdate.setAttribute("version", "0");
            directUpdate.setProperty(propertyName, jsonStr);
            const updateRes = directUpdate.apply();
            if (!updateRes.isError()) {
              savedDirectly = true;
              console.log("[bcs_label] ★★★ 後端資料庫直通保存成功 (IOM)！ ★★★");
            } else {
              console.warn("[bcs_label] IOM 直通寫入警告：", updateRes.getErrorString());
            }
          } catch (saveErr) {
            console.warn("[bcs_label] IOM 直通寫入異常：", saveErr);
          }
        }
      }
    }

    function renderDropdown(filterQuery) {
      if (!isEditMode) return;
      const q = (filterQuery || "").toLowerCase();
      const filtered = availableTags.filter((t) => {
        if (store.has(t.name)) return false;
        if (!q) return true;
        return t.name.toLowerCase().includes(q) || t.getDisplayLabel(currentLang).toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        dropdown.innerHTML = '<div class="bcs-dropdown-empty">無匹配的標籤</div>';
      } else {
        dropdown.innerHTML = "";
        filtered.forEach((tag) => {
          const item = document.createElement("div");
          item.className = "bcs-dropdown-item";
          item.innerHTML = `
            <div>
              <span class="bcs-dropdown-color-dot" style="background-color: ${tag.color};"></span>
              <strong>${tag.getDisplayLabel(currentLang)}</strong>
              <span class="bcs-dropdown-subtext">${tag.name}</span>
            </div>
          `;
          item.onmousedown = (e) => {
            e.preventDefault();
            store.add(tag);
            syncValue();
            renderBadges();
            input.value = "";
            dropdown.classList.remove("is-open");
          };
          dropdown.appendChild(item);
        });
      }
      dropdown.classList.add("is-open");
    }

    if (isEditMode) {
      input.onfocus = () => {
        wrapper.classList.add("is-focused");
        renderDropdown(input.value.trim());
      };
      input.onblur = () => {
        wrapper.classList.remove("is-focused");
        setTimeout(() => dropdown.classList.remove("is-open"), 180);
      };
      input.oninput = (e) => renderDropdown(e.target.value.trim());
      input.onkeydown = (e) => {
        if (e.key === "Backspace" && !input.value) {
          const tags = store.getAll();
          if (tags.length > 0) {
            store.removeByName(tags[tags.length - 1].name);
            syncValue();
            renderBadges();
          }
        } else if (e.key === "Escape") {
          dropdown.classList.remove("is-open");
        }
      };
    }

    renderBadges();
  };
})(window);
</script>
